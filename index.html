<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store Entry</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="splash-overlay" id="splash-screen">
        <div class="splash-modal">
            <!-- Step 1: Location Selection -->
            <div id="step-location">
                <h2>Welcome</h2>
                <p>Where are you buying from?</p>
                <div class="button-group">
                    <button class="primary-btn" onclick="setRegion('Israel')">Israel</button>
                    <button class="primary-btn" onclick="setRegion('USA')">USA</button>
                </div>
            </div>

            <!-- Step 2: Language Selection (Hidden by default) -->
            <div id="step-language" style="display: none;">
                <h2>Choose Language</h2>
                <p>Select your preferred website language:</p>
                <div class="button-group">
                    <button class="secondary-btn" onclick="setLanguage('he')">עברית</button>
                    <button class="secondary-btn" onclick="setLanguage('ru')">Русский</button>
                    <button class="secondary-btn" onclick="setLanguage('en')">English</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content (Hidden until splash is cleared) -->
    <main id="main-content" style="display: none;">
        <h1>Main Store Page</h1>
        <p>Book details, cart, and checkout will go here.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
